<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Control CFW500 - FAD (GitHub Pages)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.1/dist/chartjs-adapter-moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar { background-color: #3a3f51; }
        .card { 
            background-color: #343842; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); 
            border-radius: 0.5rem; 
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-left 0.2s;
            border-left: 4px solid transparent;
        }
        .menu-item.active, .menu-item:hover {
            color: white;
            background-color: #2c2f3a;
        }
        .menu-item.active {
            border-left: 4px solid #f18f01;
            font-weight: 600;
        }
        .chart-container {
            position: relative;
            height: 40vh;
            width: 100%;
            margin-bottom: 2rem;
            padding: 1rem;
            background-color: #2c2f3a;
            border-radius: 0.5rem;
        }
        .table-header { background-color: #3a3f51; color: #f18f01; }
        @keyframes pulse-red {
            0%, 100% { background-color: #b91c1c; }
            50% { background-color: #ef4444; }
        }
        .alert-pulse {
            animation: pulse-red 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-[#2c2f3a] text-gray-100 min-h-screen">

    <div class="flex flex-col lg:flex-row min-h-screen">
        <aside class="sidebar lg:w-64 p-6 flex flex-col gap-6 lg:h-auto h-20">
            <div class="text-2xl font-bold text-white lg:mb-8 hidden lg:block">FAD Cloud</div>
            <nav class="flex lg:flex-col space-x-4 lg:space-x-0 lg:space-y-3 font-semibold text-gray-400">
                <a id="nav-main" class="menu-item active" onclick="loadPage('main')">
                    <span>Principal</span>
                </a>
                <a id="nav-reports" class="menu-item" onclick="loadPage('reports')">
                    <span>Reportes</span>
                </a>
                <a id="nav-history" class="menu-item" onclick="loadPage('history')">
                    <span>Historial de Frecuencia</span>
                </a>
            </nav>
        </aside>

        <main id="page-content" class="flex-1 p-6 lg:p-10 overflow-y-auto">
        </main>
    </div>

    <script>
        // ------------------ CONFIGURACIÓN DE APIS Y INFLUXDB ------------------
        // Ajusta la IP/Dominio público o túnel DuckDNS/ngrok de la Raspberry Pi para acciones de control
        const RASPBERRY_API_URL = "http://TU_PI_IP_O_DOMINIO:5000"; 
        
        // Ajusta las credenciales de InfluxDB Cloud
        const INFLUX_URL = "https://us-east-1-1.aws.cloud2.influxdata.com"; 
        const INFLUX_TOKEN = "TU_INFLUX_TOKEN_AQUI";
        const INFLUX_ORG = "TU_ORGANIZACION";
        const INFLUX_BUCKET = "cfw500_monitoring";

        // Función centralizada para consultas Flux a InfluxDB Cloud
        async function queryInflux(fluxQuery) {
            const url = `${INFLUX_URL}/api/v2/query?org=${encodeURIComponent(INFLUX_ORG)}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': `Token ${INFLUX_TOKEN}`,
                    'Content-Type': 'application/flux',
                    'Accept': 'application/csv'
                },
                body: fluxQuery
            });

            if (!response.ok) {
                throw new Error(`InfluxDB Query Error: ${response.statusText}`);
            }

            const csvText = await response.text();
            return parseInfluxCSV(csvText);
        }

        function parseInfluxCSV(csvText) {
            const lines = csvText.trim().split('\n').filter(line => !line.startswith('#') && line.trim() !== '');
            if (lines.length < 2) return [];

            const headers = lines[0].split(',');
            const timeIdx = headers.indexOf('_time');
            const valueIdx = headers.indexOf('_value');

            const results = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols[timeIdx] && cols[valueIdx]) {
                    results.push({
                        ts: cols[timeIdx],
                        value: parseFloat(cols[valueIdx])
                    });
                }
            }
            return results;
        }

        const newControlPanelHTML = `
            <div id="band-alert-banner" class="hidden alert-pulse p-4 rounded-lg mb-4 text-center font-bold text-white shadow-xl">
                ⚠️ ¡ALERTA! FRECUENCIA DE REFERENCIA FUERA DE BANDA ⚠️
            </div>

            <hr class="my-4 border-gray-600">

            <h3 class="text-xl font-semibold mb-3 text-yellow-300">1. Leer y Escribir Frecuencia de Referencia</h3>
            <form id="set-ref-freq-form" class="space-y-3">
                <div class="flex space-x-2">
                    <input type="number" id="new-ref-freq" min="0.00" max="60.00" step="0.01" placeholder="Frecuencia (Hz, ej: 50.00)"
                        class="flex-1 p-2 rounded bg-[#2c2f3a] border border-gray-600 focus:ring-[#f18f01] focus:border-[#f18f01] text-white" required>
                    <input type="password" id="ref-freq-password" placeholder="Contraseña Admin" 
                        class="w-32 p-2 rounded bg-[#2c2f3a] border border-gray-600 text-white" required>
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                    Establecer Frecuencia
                </button>
                <p id="ref-freq-status" class="mt-2 text-sm text-center text-gray-400"></p>
            </form>

            <hr class="my-6 border-gray-600">

            <h3 class="text-xl font-semibold mb-3 text-red-400">2. Modificar Banda de Alerta (<span id="current-band-limits">-- Hz</span>)</h3>
            <form id="set-band-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="min-band" min="0.00" max="60.00" step="0.01" placeholder="Límite Mínimo (Hz)"
                        class="p-2 rounded bg-[#2c2f3a] border border-gray-600 text-white" required>
                    <input type="number" id="max-band" min="0.00" max="60.00" step="0.01" placeholder="Límite Máximo (Hz)"
                        class="p-2 rounded bg-[#2c2f3a] border border-gray-600 text-white" required>
                </div>
                <input type="password" id="band-password" placeholder="Contraseña Admin" 
                    class="w-full p-2 rounded bg-[#2c2f3a] border border-gray-600 text-white" required>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                    Establecer Banda
                </button>
                <p id="band-status" class="mt-2 text-sm text-center text-gray-400"></p>
            </form>
        `;

        const mainContentHTML = `
            <div class="content-container">
                <h1 class="text-3xl font-bold mb-6 text-white">Control del Variador CFW500</h1>

                <div class="grid grid-cols-1 gap-6">

                    <div id="params-card" class="card p-6 rounded-lg">
                        <h2 class="text-xl font-semibold mb-4 text-[#45e545]">Parámetros de Operación</h2>
                        <div class="space-y-4">
                            <p class="flex justify-between items-center text-lg">
                                <span>Frecuencia Actual (Medida):</span>
                                <span id="actual-freq" class="font-mono text-2xl text-yellow-300">-- Hz</span>
                            </p>
                            <p class="flex justify-between items-center text-lg">
                                <span>Frecuencia de Referencia:</span>
                                <span id="target-freq" class="font-mono text-2xl text-orange-400">-- Hz</span>
                            </p>
                        </div>
                        ${newControlPanelHTML}
                    </div>
                </div>

                <div id="safety-card" class="card p-6 rounded-lg mt-6">
                    <h2 class="text-xl font-semibold mb-4 text-yellow-500 flex items-center gap-2">
                        Dias sin Accidentes
                    </h2>
                    <p id="safety-status" class="text-2xl font-mono text-center mb-2">--</p>
                    <p id="last-accident-ts" class="text-sm text-center text-gray-400">Último incidente: --</p>
                    <div class="text-center mt-4">
                        <button id="reset-counter-btn" onclick="showResetModal()" 
                            class="bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-4 rounded transition duration-200 text-sm">
                            Reiniciar Contador
                        </button>
                    </div>
                </div>

                <div id="accident-history-card" class="card p-6 rounded-lg mt-6">
                    <h2 class="text-xl font-semibold mb-4 text-red-400 flex items-center gap-2">
                        Historial de Reinicios de Seguridad
                    </h2>
                    <div class="overflow-x-auto shadow-md rounded-lg">
                        <table class="min-w-full divide-y divide-gray-600">
                            <thead class="table-header bg-red-800/50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-red-300">Fecha y Hora</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-red-300">Motivo del Reinicio</th>
                                </tr>
                            </thead>
                            <tbody id="accident-history-list" class="bg-[#2c2f3a] divide-y divide-gray-700">
                                <tr><td colspan="2" class="px-6 py-4 text-center text-gray-500">Cargando historial...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <p id="accident-history-status" class="mt-4 text-sm text-center text-gray-400"></p>
                </div>
            </div>

            <div id="reset-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
                <div class="bg-gray-700 p-6 rounded-lg w-96">
                    <h3 class="text-xl font-bold mb-4">Confirmar Reinicio</h3>
                    <p class="mb-4">Ingrese la contraseña de administrador y la razón del reinicio del contador de seguridad.</p>
                    <input type="password" id="admin-password-input" placeholder="Contraseña de Administrador"
                        class="w-full p-2 mb-3 rounded bg-gray-800 border border-gray-600 text-white">
                    <textarea id="reset-reason-input" rows="3" placeholder="Razón del Accidente/Reinicio"
                        class="w-full p-2 mb-4 rounded bg-gray-800 border border-gray-600 text-white"></textarea>
                    
                    <div class="flex justify-end space-x-3">
                        <button onclick="hideResetModal()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">
                            Cancelar
                        </button>
                        <button onclick="resetCounter()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                            Confirmar Reinicio
                        </button>
                    </div>
                    <p id="modal-status" class="mt-4 text-center text-sm font-semibold"></p>
                </div>
            </div>
        `;

        const reportsContentHTML = `
            <div class="content-container">
                <h1 class="text-3xl font-bold mb-6 text-white">Reportes de Frecuencia (InfluxDB Cloud)</h1>
                
                <div class="card p-4 rounded-lg mb-6">
                    <h2 class="text-xl font-semibold mb-2 text-[#45e545]">Frecuencia en Tiempo Real (Un_Hs)</h2>
                    
                    <div class="flex justify-between items-center mb-4"> 
                        <p class="text-sm text-gray-400">Datos leídos directamente de InfluxDB Cloud.</p>
                        <button onclick="resetZoom()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded text-sm transition duration-200 flex items-center gap-1">
                            Reiniciar Zoom
                        </button>
                    </div>
                    
                    <div class="chart-container">
                        <canvas id="realTimeChart"></canvas>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="card p-4 rounded-lg">
                        <h2 class="text-xl font-semibold mb-2 text-yellow-300">Promedio Diario (Últimas 24 Horas)</h2>
                        <div class="chart-container">
                            <canvas id="hourlyChart"></canvas>
                        </div>
                    </div>
                    <div class="card p-4 rounded-lg">
                        <h2 class="text-xl font-semibold mb-2 text-orange-400">Promedio Mensual (Últimos 30 Días)</h2>
                        <div class="chart-container">
                            <canvas id="monthlyChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        `;

        const historyContentHTML = `
            <div class="content-container">
                <h1 class="text-3xl font-bold mb-6 text-white">Historial de Frecuencia (InfluxDB Cloud)</h1>
                <div class="card p-6 rounded-lg">
                    <div class="overflow-x-auto shadow-md rounded-lg">
                        <table class="min-w-full divide-y divide-gray-600">
                            <thead class="table-header">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-[#45e545]">Timestamp</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-[#45e545]">Frecuencia (Hz)</th>
                                </tr>
                            </thead>
                            <tbody id="frequency-history-list" class="bg-[#2c2f3a] divide-y divide-gray-700">
                                <tr><td colspan="2" class="px-6 py-4 text-center text-gray-500">Cargando datos desde InfluxDB Cloud...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <p id="history-loading-status" class="mt-4 text-sm text-center text-gray-400"></p>
                </div>
            </div>
        `;

        async function updateStatus() {
            try {
                const response = await fetch(`${RASPBERRY_API_URL}/status`);
                const data = await response.json();

                if (data.ok) {
                    const actualEl = document.getElementById('actual-freq');
                    const targetEl = document.getElementById('target-freq');
                    if (actualEl) actualEl.textContent = `${data.measured_freq.toFixed(2)} Hz`;
                    if (targetEl) targetEl.textContent = `${data.ref_freq.toFixed(2)} Hz`;

                    const currentBandLimits = document.getElementById('current-band-limits');
                    if (currentBandLimits) {
                        currentBandLimits.textContent = `${data.min_band.toFixed(2)} - ${data.max_band.toFixed(2)} Hz`;
                    }

                    const alertBanner = document.getElementById('band-alert-banner');
                    const paramsCard = document.getElementById('params-card');

                    if (data.alert_active) {
                        if (alertBanner) alertBanner.classList.remove('hidden');
                        if (paramsCard) paramsCard.classList.add('border-4', 'border-red-700');
                    } else {
                        if (alertBanner) alertBanner.classList.add('hidden');
                        if (paramsCard) paramsCard.classList.remove('border-4', 'border-red-700');
                    }
                }
            } catch (error) {
                console.error('Error al actualizar estado:', error);
            }
        }

        async function setRefFrequency(event) {
            event.preventDefault();
            const statusEl = document.getElementById('ref-freq-status');
            const newFreq = document.getElementById('new-ref-freq').value;
            const password = document.getElementById('ref-freq-password').value;

            if (statusEl) {
                statusEl.textContent = 'Enviando comando a Raspberry Pi...';
                statusEl.className = 'mt-2 text-sm text-center text-yellow-300';
            }
            
            try {
                const response = await fetch(`${RASPBERRY_API_URL}/api/set_ref_freq`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ frequency: parseFloat(newFreq), password: password })
                });
                const data = await response.json();

                if (response.ok && data.ok) {
                    if (statusEl) {
                        statusEl.textContent = data.message;
                        statusEl.className = 'mt-2 text-sm text-center text-green-500';
                    }
                    updateStatus();
                } else {
                    if (statusEl) {
                        statusEl.textContent = `Error: ${data.error || data.message || 'Error desconocido'}`;
                        statusEl.className = 'mt-2 text-sm text-center text-red-500';
                    }
                }
            } catch (error) {
                if (statusEl) {
                    statusEl.textContent = 'Error de comunicación con la Raspberry Pi.';
                    statusEl.className = 'mt-2 text-sm text-center text-red-500';
                }
            }
        }

        async function setBandLimits(event) {
            event.preventDefault();
            const statusEl = document.getElementById('band-status');
            const minBand = document.getElementById('min-band').value;
            const maxBand = document.getElementById('max-band').value;
            const password = document.getElementById('band-password').value;

            if (statusEl) {
                statusEl.textContent = 'Estableciendo...';
                statusEl.className = 'mt-2 text-sm text-center text-yellow-300';
            }
            
            try {
                const response = await fetch(`${RASPBERRY_API_URL}/set_band`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ min_band: parseFloat(minBand), max_band: parseFloat(maxBand), password: password })
                });
                const data = await response.json();

                if (response.ok && data.ok) {
                    if (statusEl) {
                        statusEl.textContent = data.message;
                        statusEl.className = 'mt-2 text-sm text-center text-green-500';
                    }
                    updateStatus();
                } else {
                    if (statusEl) {
                        statusEl.textContent = `Error: ${data.message || 'Error desconocido'}`;
                        statusEl.className = 'mt-2 text-sm text-center text-red-500';
                    }
                }
            } catch (error) {
                if (statusEl) {
                    statusEl.textContent = 'Error de conexión con la Raspberry Pi.';
                    statusEl.className = 'mt-2 text-sm text-center text-red-500';
                }
            }
        }

        function setupMainPage() {
            const refForm = document.getElementById('set-ref-freq-form');
            if (refForm) refForm.addEventListener('submit', setRefFrequency);
            
            const bandForm = document.getElementById('set-band-form');
            if (bandForm) bandForm.addEventListener('submit', setBandLimits);

            updateStatus(); 
            if (!window.statusInterval) {
                window.statusInterval = setInterval(updateStatus, 3000); 
            }

            getSafetyStatus(); 
            getAccidentHistory(); 
        }

        window.loadPage = (page) => {
            const contentEl = document.getElementById('page-content');
            
            if (page === 'main') {
                contentEl.innerHTML = mainContentHTML;
                setupMainPage(); 
            } else if (page === 'reports') {
                contentEl.innerHTML = reportsContentHTML;
                setTimeout(() => {
                    initRealTimeChart();
                    initHourlyChart();
                    initMonthlyChart();
                }, 100); 
            } else if (page === 'history') {
                contentEl.innerHTML = historyContentHTML;
                getFrequencyHistory(); 
            }

            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            const navItem = document.getElementById(`nav-${page}`);
            if(navItem) navItem.classList.add('active');

            if (page !== 'main' && window.statusInterval) {
                 clearInterval(window.statusInterval);
                 window.statusInterval = null;
            }
        }

        async function getSafetyStatus() {
            try {
                const response = await fetch(`${RASPBERRY_API_URL}/api/time_since_accident`);
                const data = await response.json();
                const days = data.days_since ?? '--';
                const lastTs = data.last_accident_ts ?? '--';
                
                const safetyEl = document.getElementById('safety-status');
                const lastEl = document.getElementById('last-accident-ts');
                if (safetyEl) safetyEl.textContent = `${days} días`;
                if (lastEl) lastEl.textContent = `Último incidente: ${lastTs}`;
            } catch (error) {
                console.error('Error al obtener estado de seguridad:', error);
            }
        }

        async function getAccidentHistory() {
            const listEl = document.getElementById('accident-history-list');
            if (!listEl) return; 

            try {
                const response = await fetch(`${RASPBERRY_API_URL}/api/accident_history`);
                const history = await response.json();

                listEl.innerHTML = '';
                if (!history || history.length === 0) {
                    listEl.innerHTML = '<tr><td colspan="2" class="px-6 py-4 text-center text-gray-500">No hay historial de reinicios.</td></tr>';
                    return;
                }

                history.forEach(item => {
                    const row = `
                        <tr class="hover:bg-[#3a3f51]">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-300">${item.timestamp}</td>
                            <td class="px-6 py-4 text-sm text-gray-400">${item.reason}</td>
                        </tr>
                    `;
                    listEl.innerHTML += row;
                });

            } catch (error) {
                listEl.innerHTML = '<tr><td colspan="2" class="px-6 py-4 text-center text-red-500">Error cargando historial.</td></tr>';
            }
        }

        function showResetModal() {
            document.getElementById('reset-modal').classList.remove('hidden');
        }

        function hideResetModal() {
            document.getElementById('reset-modal').classList.add('hidden');
        }

        async function resetCounter() {
            const password = document.getElementById('admin-password-input').value;
            const reason = document.getElementById('reset-reason-input').value;
            const modalStatus = document.getElementById('modal-status');
            
            if (!password || !reason) {
                modalStatus.textContent = 'Ingrese la contraseña y el motivo.';
                modalStatus.className = 'mt-4 text-center text-sm font-semibold text-yellow-400';
                return;
            }

            try {
                const response = await fetch(`${RASPBERRY_API_URL}/api/reset_accident_counter`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, reason })
                });

                const result = await response.json();

                if (response.ok && result.ok) {
                    modalStatus.textContent = `✅ Contador Reiniciado.`;
                    modalStatus.className = 'mt-4 text-center text-sm font-semibold text-green-400';
                    getSafetyStatus();
                    getAccidentHistory();
                    setTimeout(hideResetModal, 2000);
                } else {
                    modalStatus.textContent = `❌ ${result.message || result.error}`;
                    modalStatus.className = 'mt-4 text-center text-sm font-semibold text-red-500';
                }
            } catch (error) {
                modalStatus.textContent = `❌ Error de conexión.`;
                modalStatus.className = 'mt-4 text-center text-sm font-semibold text-red-500';
            }
        }

        let realTimeChart = null;
        let hourlyChart = null;
        let monthlyChart = null;
        
        function resetZoom() {
            if (realTimeChart && typeof realTimeChart.resetZoom === 'function') {
                realTimeChart.resetZoom();
            }
        }

        async function initRealTimeChart() {
            const ctx = document.getElementById('realTimeChart')?.getContext('2d');
            if (!ctx) return;

            try {
                const fluxQuery = `
                    from(bucket: "${INFLUX_BUCKET}")
                        |> range(start: -1h)
                        |> filter(fn: (r) => r["_measurement"] == "cfw500_telemetry")
                        |> filter(fn: (r) => r["_field"] == "freq_hz")
                        |> yield(name: "last")
                `;
                const data = await queryInflux(fluxQuery);
                const chartData = data.map(d => ({ x: d.ts, y: d.value }));

                if (realTimeChart) realTimeChart.destroy();

                realTimeChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        datasets: [{
                            label: 'Frecuencia (Hz)',
                            data: chartData,
                            borderColor: '#f18f01',
                            backgroundColor: 'rgba(241, 143, 1, 0.2)',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                type: 'time',
                                time: { unit: 'minute', tooltipFormat: 'YYYY-MM-DD HH:mm:ss' },
                                title: { display: true, text: 'Tiempo', color: '#c6c8d6' },
                                ticks: { color: '#c6c8d6' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            },
                            y: {
                                title: { display: true, text: 'Frecuencia (Hz)', color: '#c6c8d6' },

                });

                console.error('Error cargando datos de InfluxDB Cloud:', error);
            }
        }

        async function initHourlyChart() {
            const ctx = document.getElementById('hourlyChart')?.getContext('2d');
            if (!ctx) return;
            
            try {
                const fluxQuery = `
                    from(bucket: "${INFLUX_BUCKET}")
                        |> range(start: -24h)
                        |> filter(fn: (r) => r["_measurement"] == "cfw500_telemetry")
                        |> filter(fn: (r) => r["_field"] == "freq_hz")
                        |> aggregateWindow(every: 1h, fn: mean, createEmpty: false)
                        |> yield(name: "hourly_mean")
                `;
                const data = await queryInflux(fluxQuery);
                const chartData = data.map(d => ({ x: d.ts, y: d.value }));

                if (hourlyChart) hourlyChart.destroy();

                hourlyChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        datasets: [{
                            label: 'Promedio Por Hora (24h)',
                            data: chartData,
                            backgroundColor: '#45e545',
                            borderColor: '#45e545',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                type: 'time',
                                time: { unit: 'hour', tooltipFormat: 'YYYY-MM-DD HH:mm' },
                                title: { display: true, text: 'Hora', color: '#c6c8d6' },
                                ticks: { color: '#c6c8d6' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            },
                            y: {
                                title: { display: true, text: 'Promedio Hz', color: '#c6c8d6' },
                                ticks: { color: '#c6c8d6' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' },
                                min: 0,
                                max: 60
                            }
                        },
                        plugins: { legend: { labels: { color: '#c6c8d6' } } }
                    }
                });
            } catch (error) {
                console.error('Error cargando gráfico hourly de InfluxDB Cloud:', error);
            }
        }

        async function initMonthlyChart() {
            const ctx = document.getElementById('monthlyChart')?.getContext('2d');
            if (!ctx) return;
            
            try {
                const fluxQuery = `
                    from(bucket: "${INFLUX_BUCKET}")
                        |> range(start: -30d)
                        |> filter(fn: (r) => r["_measurement"] == "cfw500_telemetry")
                        |> filter(fn: (r) => r["_field"] == "freq_hz")
                        |> aggregateWindow(every: 1d, fn: mean, createEmpty: false)
                        |> yield(name: "daily_mean")
                `;
                const data = await queryInflux(fluxQuery);
                const chartData = data.map(d => ({ x: d.ts, y: d.value }));

                if (monthlyChart) monthlyChart.destroy();

                monthlyChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        datasets: [{
                            label: 'Promedio Diario (30 Días)',
                            data: chartData,
                            borderColor: '#ffa500',
                            backgroundColor: 'rgba(255,165,0,0.2)',
                            borderWidth: 2,

                            pointRadius: 3

                    },
                    options: {
                        responsive: true,

                                title: { display: true, text: 'Día', color: '#c6c8d6' },
                                ticks: { color: '#c6c8d6' },
                                grid: { color: 'rgba(255,255,255,0.1)' }
                            },
                            y: {
                                title: { display: true, text: 'Promedio Hz', color: '#c6c8d6' },
                                ticks: { color: '#c6c8d6' },
                                grid: { color: 'rgba(255,255,255,0.1)' },
                                min: 0,
                                max: 60
                            }
                        },
                        plugins: { legend: { labels: { color: '#c6c8d6' } } }
                    }
                });
            } catch (error) {
                console.error('Error cargando gráfico mensual:', error);
            }
        }

        async function getFrequencyHistory() {
            const listEl = document.getElementById('frequency-history-list');
            const statusEl = document.getElementById('history-loading-status');
            if (!listEl) return;

            if (statusEl) statusEl.textContent = 'Cargando datos desde InfluxDB Cloud...';
            
            try {
                const fluxQuery = `
                    from(bucket: "${INFLUX_BUCKET}")
                        |> range(start: -24h)
                        |> filter(fn: (r) => r["_measurement"] == "cfw500_telemetry")
                        |> filter(fn: (r) => r["_field"] == "freq_hz")
                        |> limit(n: 500)
                `;
                const data = await queryInflux(fluxQuery);
                
                listEl.innerHTML = '';
                if (!data || data.length === 0) {
                    listEl.innerHTML = '<tr><td colspan="2" class="px-6 py-4 text-center text-gray-500">No hay datos recientes en InfluxDB Cloud.</td></tr>';
                    if (statusEl) statusEl.textContent = 'Carga completa.';
                    return;
                }

                data.forEach(item => {
                    const timestamp = moment(item.ts).format('YYYY-MM-DD HH:mm:ss');
                    const row = `
                        <tr class="hover:bg-[#3a3f51]">
                            <td class="px-6 py-2 whitespace-nowrap text-sm font-medium text-gray-300">${timestamp}</td>
                            <td class="px-6 py-2 whitespace-nowrap text-sm text-gray-400">${item.value.toFixed(2)} Hz</td>
                        </tr>
                    `;
                    listEl.innerHTML += row;
                });
                if (statusEl) statusEl.textContent = `Mostrando ${data.length} registros desde InfluxDB.`;
                
            } catch (error) {
                listEl.innerHTML = '<tr><td colspan="2" class="px-6 py-4 text-center text-red-500">Error cargando historial desde InfluxDB Cloud.</td></tr>';
                if (statusEl) statusEl.textContent = 'Error al cargar datos.';
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            window.loadPage('main');
        });
    </script>
</body>
